spring:
  application:
    name: terruno-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/terruno?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:terruno}
    password: ${DB_PASSWORD:terruno}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities match it.
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  web:
    # The site is in Spanish, so built-in validation messages are too (whatever the client's Accept-Language).
    locale: es
    locale-resolver: fixed

server:
  port: ${PORT:8080}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  jwt:
    # HMAC-SHA256 signing key, at least 32 characters. The default is for local development only:
    # always set JWT_SECRET in any shared or production environment.
    secret: ${JWT_SECRET:local-dev-only-secret-change-me-0123456789}
    issuer: terruno-api
    ttl: ${JWT_TTL:7d}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

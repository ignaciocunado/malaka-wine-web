name: Combine PRs

on:
  schedule:
    - cron: '0 1 * * 3' # Wednesday at 01:00
  workflow_dispatch: # allows you to manually trigger the workflow

# The minimum permissions required to run this Action
permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: write # to start CI on the combined branch

jobs:
  combine-prs:
    runs-on: ubuntu-latest

    steps:
      - name: combine-prs
        id: combine-prs
        uses: github/combine-prs@v5.2.0
        with:
          labels: combined-pr # Optional: add a label to the combined PR

      # A pull request opened with the workflow's own token doesn't start other workflows, so CI never ran on the
      # combined PR. workflow_dispatch is the exception to that rule: starting CI this way puts its checks on the
      # combined branch's head commit, which is where the PR shows them.
      - name: Run CI on the combined branch
        if: steps.combine-prs.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref combined-prs-branch
